# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    chain_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

chain_joint_trajectory_controller:
  ros__parameters:
    joints:
      - agent_n2_pivot_base_joint
      - agent_n3_pivot_base_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity